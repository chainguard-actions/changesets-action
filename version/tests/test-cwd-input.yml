name: Test cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as cwd
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir"
          # Create a minimal package.json so changesets can find a project root
          echo '{"name":"test-pkg","version":"1.0.0"}' > "$GITHUB_WORKSPACE/subdir/package.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: ./subdir
          commit-message: "Version Packages (cwd test)"
          pr-title: "Version Packages (cwd test)"
      - name: Assert action ran with cwd input (graceful failure on sentinel repo is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cwd input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
