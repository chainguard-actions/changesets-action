name: Test custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a subdirectory to use as cwd
        run: mkdir -p "$GITHUB_WORKSPACE/subdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: ./subdir
      - name: Assert action ran with custom cwd (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pr-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-number: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no changesets in subdir)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
