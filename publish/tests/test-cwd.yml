name: Test with cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as cwd
        run: mkdir -p /tmp/test-cwd
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: echo "publishing from cwd"
          cwd: /tmp/test-cwd
          create-github-releases: "false"
          push-git-tags: "false"
      - name: Assert action ran with cwd or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but 'published' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or missing changesets config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
