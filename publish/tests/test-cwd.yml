name: Test cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a subdirectory as cwd
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir"
          # Create a minimal package.json so changesets can find a project root
          cat > "$GITHUB_WORKSPACE/subdir/package.json" <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": true
          }
          EOF
          # Create a minimal .changeset directory
          mkdir -p "$GITHUB_WORKSPACE/subdir/.changeset"
          cat > "$GITHUB_WORKSPACE/subdir/.changeset/config.json" <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@2.3.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: ./subdir
      - name: Assert action ran with cwd input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but 'published' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with cwd input, published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or no changesets)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
