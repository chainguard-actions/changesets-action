name: Test published-packages output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create minimal package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: echo "no-op publish"
          create-github-releases: "false"
          push-git-tags: "false"

      - name: Assert published-packages output is valid JSON array when present
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.published-packages }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "published-packages: $PUBLISHED_PACKAGES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but 'published' output is empty"
              exit 1
            fi
            # If published is true, published-packages must be a non-empty JSON array
            if [ "$PUBLISHED" = "true" ]; then
              if [ -z "$PUBLISHED_PACKAGES" ]; then
                echo "FAIL: published=true but published-packages is empty"
                exit 1
              fi
              # Validate it looks like a JSON array
              echo "$PUBLISHED_PACKAGES" | node -e "
                const data = require('fs').readFileSync('/dev/stdin','utf8').trim();
                const arr = JSON.parse(data);
                if (!Array.isArray(arr)) {
                  console.error('FAIL: published-packages is not a JSON array');
                  process.exit(1);
                }
                arr.forEach((pkg, i) => {
                  if (!pkg.name || !pkg.version) {
                    console.error('FAIL: package at index ' + i + ' missing name or version');
                    process.exit(1);
                  }
                });
                console.log('PASS: published-packages is a valid JSON array with', arr.length, 'package(s)');
              "
            elif [ "$PUBLISHED" = "false" ]; then
              echo "PASS: published=false, no packages published (no changesets to release)"
            else
              echo "FAIL: 'published' output must be 'true' or 'false', got: $PUBLISHED"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
