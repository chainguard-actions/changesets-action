name: Test with create-github-releases and push-git-tags disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: echo "publishing without releases or tags"
          create-github-releases: "false"
          push-git-tags: "false"
      - name: Assert action ran with releases and tags disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.published-packages }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "published-packages: $PUBLISHED_PACKAGES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded without creating releases or tags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in sentinel repo environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
