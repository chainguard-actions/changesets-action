name: Test pack-dir-artifact-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pack-dir-artifact-id: "12345"
          create-github-releases: "false"
          push-git-tags: "false"
      - name: Assert action ran with pack-dir-artifact-id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real artifact)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
