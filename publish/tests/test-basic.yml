name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          create-github-releases: "false"
          push-git-tags: "false"
      - name: Assert action ran (published output set, or failed gracefully on sentinel repo)
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but 'published' output is empty"
              exit 1
            fi
            echo "PASS: published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
