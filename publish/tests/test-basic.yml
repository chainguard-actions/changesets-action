name: Test basic publish action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        run: |
          node --version
          npm --version

      - name: Create minimal package.json for publish script
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: echo "no-op publish"
          create-github-releases: "false"
          push-git-tags: "false"

      - name: Assert action ran (published output or graceful failure on sentinel repo)
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but 'published' output is empty"
              exit 1
            fi
            if [ "$PUBLISHED" != "true" ] && [ "$PUBLISHED" != "false" ]; then
              echo "FAIL: 'published' output must be 'true' or 'false', got: $PUBLISHED"
              exit 1
            fi
            echo "PASS: published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
