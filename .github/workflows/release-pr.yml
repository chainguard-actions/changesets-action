name: Release PR

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  release_check:
    if: github.repository == 'changesets/action' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/release-pr')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - id: report_in_progress
        run: |
          raw=$(gh api "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes' --jq '.id')
          safe=$(printf '%s' "$raw" | tr -d '\n\r')
          echo "in_progress_reaction_id=$safe" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - id: check_authorization
        run: |
          if [[ "$AUTHOR_ASSOCIATION" == 'MEMBER' || "$AUTHOR_ASSOCIATION" == 'OWNER' || "$AUTHOR_ASSOCIATION" == 'COLLABORATOR' ]]
          then
            echo "User is authorized to release"
          else
            echo "User is not authorized to release"
            exit 1
          fi
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}

    outputs:
      in_progress_reaction_id: ${{ steps.report_in_progress.outputs.in_progress_reaction_id }}

  release:
    if: github.repository == 'changesets/action'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: release_check
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Checkout pull request
        run: gh pr checkout "$ISSUE_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Check if Version Packages PR
        id: check_version_packages
        run: |
          raw=$(gh pr view "$ISSUE_NUMBER" --json headRefName --jq '.headRefName|startswith("changeset-release/")')
          safe=$(printf '%s' "$raw" | tr -d '\n\r')
          echo "version_packages=$safe" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Reset Version Packages PR
        if: steps.check_version_packages.outputs.version_packages == 'true'
        run: git reset --hard HEAD~1

      - run: yarn changeset version --snapshot "pr$ISSUE_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Build
        run: yarn build

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release snapshot version
        run: yarn run release:pr

      - run: gh api "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='rocket'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - run: gh api -X DELETE "/repos/$REPO/issues/comments/$COMMENT_ID/reactions/$IN_PROGRESS_REACTION_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IN_PROGRESS_REACTION_ID: ${{ needs.release_check.outputs.in_progress_reaction_id }}

      - run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          gh pr comment "$ISSUE_NUMBER" --body "The [$REPO@$COMMIT_SHA](https://github.com/$REPO/commit/$COMMIT_SHA) release triggered by [this comment]($COMMENT_URL) has [succeeded](https://github.com/$REPO/actions/runs/$RUN_ID)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_URL: ${{ github.event.comment.url }}
          RUN_ID: ${{ github.run_id }}

  report-failure-if-needed:
    needs: [release_check, release]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    if: failure() && github.repository == 'changesets/action' && (needs.release_check.result == 'failure' || needs.release.result == 'failure')
    permissions:
      issues: write
      pull-requests: write
    steps:
      - run: gh api "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='-1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - run: gh api -X DELETE "/repos/$REPO/issues/comments/$COMMENT_ID/reactions/$IN_PROGRESS_REACTION_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IN_PROGRESS_REACTION_ID: ${{ needs.release_check.outputs.in_progress_reaction_id }}

      - run: gh pr comment "$ISSUE_NUMBER" --body "The release triggered by [this comment]($COMMENT_URL) has [failed](https://github.com/$REPO/actions/runs/$RUN_ID)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_URL: ${{ github.event.comment.url }}
          RUN_ID: ${{ github.run_id }}
