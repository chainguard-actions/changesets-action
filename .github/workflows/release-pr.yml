name: Release PR

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  release_check:
    if: github.repository == 'changesets/action' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/release-pr')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - id: report_in_progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          safe_repo=$(printf '%s' "$REPO" | tr -d '\n\r')
          safe_comment_id=$(printf '%s' "$COMMENT_ID" | tr -d '\n\r')
          reaction_id=$(gh api "/repos/${safe_repo}/issues/comments/${safe_comment_id}/reactions" -f content='eyes' --jq '.id')
          safe_reaction_id=$(printf '%s' "$reaction_id" | tr -d '\n\r')
          echo "in_progress_reaction_id=${safe_reaction_id}" >> "$GITHUB_OUTPUT"

      - id: check_authorization
        run: |
          if [[ "$AUTHOR_ASSOCIATION" == 'MEMBER' || "$AUTHOR_ASSOCIATION" == 'OWNER' || "$AUTHOR_ASSOCIATION" == 'COLLABORATOR' ]]
          then
            echo "User is authorized to release"
          else
            echo "User is not authorized to release"
            exit 1
          fi
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}

    outputs:
      in_progress_reaction_id: ${{ steps.report_in_progress.outputs.in_progress_reaction_id }}

  release:
    if: github.repository == 'changesets/action'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: release_check
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Checkout pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh pr checkout "$ISSUE_NUMBER"

      - name: Check if Version Packages PR
        id: check_version_packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          result=$(gh pr view "$ISSUE_NUMBER" --json headRefName --jq '.headRefName|startswith("changeset-release/")')
          safe_result=$(printf '%s' "$result" | tr -d '\n\r')
          echo "version_packages=${safe_result}" >> "$GITHUB_OUTPUT"

      - name: Reset Version Packages PR
        if: steps.check_version_packages.outputs.version_packages == 'true'
        run: git reset --hard HEAD~1

      - name: Run changeset version snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: yarn changeset version --snapshot "pr${ISSUE_NUMBER}"

      - name: Build
        run: yarn build

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release snapshot version
        run: yarn run release:pr

      - name: Add rocket reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content='rocket'

      - name: Remove in-progress reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ needs.release_check.outputs.in_progress_reaction_id }}
        run: gh api -X DELETE "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}"

      - name: Post success comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          commit=$(git rev-parse HEAD)
          gh pr comment "$ISSUE_NUMBER" --body "The [${REPO}@${commit}](https://github.com/${REPO}/commit/${commit}) release triggered by [this comment](${COMMENT_URL}) has [succeeded](https://github.com/${REPO}/actions/runs/${RUN_ID})."

  report-failure-if-needed:
    needs: [release_check, release]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    if: failure() && github.repository == 'changesets/action' && (needs.release_check.result == 'failure' || needs.release.result == 'failure')
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add failure reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content='-1'

      - name: Remove in-progress reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ needs.release_check.outputs.in_progress_reaction_id }}
        run: gh api -X DELETE "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions/${REACTION_ID}"

      - name: Post failure comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --body "The release triggered by [this comment](${COMMENT_URL}) has [failed](https://github.com/${GH_REPO}/actions/runs/${RUN_ID})."
