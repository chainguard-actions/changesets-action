name: Test publish-plan-artifact-id output consistency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert publish-plan-artifact-id is consistent with mode
        env:
          MODE: ${{ steps.action.outputs.mode }}
          ARTIFACT_ID: ${{ steps.action.outputs.publish-plan-artifact-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          echo "publish-plan-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without changesets config)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Validate mode is a known value
          if [ "$MODE" != "version" ] && [ "$MODE" != "publish" ] && [ "$MODE" != "none" ]; then
            echo "FAIL: mode '$MODE' is not one of 'version', 'publish', 'none'"
            exit 1
          fi
          # When mode is 'publish', artifact id should be set
          # When mode is 'version' or 'none', artifact id should be empty
          if [ "$MODE" = "publish" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: mode is 'publish' but publish-plan-artifact-id is empty"
              exit 1
            fi
            echo "PASS: mode is 'publish' and artifact id is set: '$ARTIFACT_ID'"
          else
            echo "PASS: mode is '$MODE', publish-plan-artifact-id is '$ARTIFACT_ID' (not required)"
          fi
