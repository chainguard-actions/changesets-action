name: Test basic usage - valid mode output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert mode output is valid
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without changesets config)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # mode must be one of: version, publish, none
          if [ "$MODE" = "version" ] || [ "$MODE" = "publish" ] || [ "$MODE" = "none" ]; then
            echo "PASS: mode is valid value '$MODE'"
          else
            echo "FAIL: mode '$MODE' is not one of 'version', 'publish', 'none'"
            exit 1
          fi
