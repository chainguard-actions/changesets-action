name: Test basic usage (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert mode output is valid
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly"
            exit 1
          fi
          if [ "$MODE" != "version" ] && [ "$MODE" != "publish" ] && [ "$MODE" != "none" ]; then
            echo "FAIL: expected mode to be 'version', 'publish', or 'none', got: '$MODE'"
            exit 1
          fi
          echo "PASS: mode='$MODE'"
