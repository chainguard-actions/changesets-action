name: Test basic usage - action runs and outputs a valid mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert mode output is valid or action failed gracefully
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            case "$MODE" in
              version|publish|none)
                echo "PASS: mode is a valid value: '$MODE'"
                ;;
              "")
                echo "FAIL: action succeeded but mode output is empty"
                exit 1
                ;;
              *)
                echo "FAIL: mode has unexpected value: '$MODE'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without changesets setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
