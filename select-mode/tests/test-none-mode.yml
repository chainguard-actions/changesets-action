name: Test mode=none (no changesets, no publishable packages)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: select-mode
        uses: .
        continue-on-error: true

      - name: Assert mode output
        env:
          MODE: ${{ steps.select-mode.outputs.mode }}
          OUTCOME: ${{ steps.select-mode.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MODE" ]; then
              echo "FAIL: action succeeded but mode output is empty"
              exit 1
            fi
            if [ "$MODE" != "none" ] && [ "$MODE" != "version" ] && [ "$MODE" != "publish" ]; then
              echo "FAIL: unexpected mode value '$MODE' (expected none, version, or publish)"
              exit 1
            fi
            echo "PASS: mode='$MODE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist/select-mode.js may not be built in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
