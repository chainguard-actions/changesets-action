name: Test none mode - no changesets and no publishable packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert mode is 'none' or action failed gracefully
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT_ID: ${{ steps.action.outputs.publish-plan-artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          echo "publish-plan-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$MODE" = "none" ]; then
              echo "PASS: mode is 'none' as expected (no changesets, no publishable packages)"
              if [ -n "$ARTIFACT_ID" ]; then
                echo "FAIL: publish-plan-artifact-id should be empty when mode is 'none'"
                exit 1
              fi
              echo "PASS: publish-plan-artifact-id is empty as expected"
            elif [ "$MODE" = "version" ] || [ "$MODE" = "publish" ]; then
              echo "PASS: mode is '$MODE' (valid value)"
            else
              echo "FAIL: mode has unexpected value: '$MODE'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
