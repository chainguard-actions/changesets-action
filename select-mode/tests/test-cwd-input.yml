name: Test cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a custom working directory with a changeset
        run: |
          mkdir -p tests/fixtures/cwd-test/.changeset
          cat > tests/fixtures/cwd-test/package.json << 'EOF'
          {
            "name": "cwd-test-pkg",
            "version": "1.0.0",
            "private": false
          }
          EOF
          cat > tests/fixtures/cwd-test/.changeset/my-change.md << 'EOF'
          ---
          "cwd-test-pkg": minor
          ---

          A minor change for testing cwd input
          EOF

      - id: action
        uses: .
        with:
          cwd: tests/fixtures/cwd-test
        continue-on-error: true

      - name: Assert mode output is valid when using cwd
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MODE" ]; then
              echo "FAIL: action succeeded but mode output is empty"
              exit 1
            fi
            if [ "$MODE" != "version" ] && [ "$MODE" != "publish" ] && [ "$MODE" != "none" ]; then
              echo "FAIL: unexpected mode value '$MODE'"
              exit 1
            fi
            echo "PASS: mode='$MODE' with cwd input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing dist)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
