name: Test cwd input parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a subdirectory as working directory with changeset config
        run: |
          mkdir -p tests/fixtures/cwd-test/.changeset
          cat > tests/fixtures/cwd-test/.changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

      - id: select-mode
        uses: .
        with:
          cwd: tests/fixtures/cwd-test
        continue-on-error: true

      - name: Assert action ran with cwd input
        env:
          MODE: ${{ steps.select-mode.outputs.mode }}
          OUTCOME: ${{ steps.select-mode.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MODE" ]; then
              echo "FAIL: action succeeded but mode output is empty"
              exit 1
            fi
            if [ "$MODE" != "none" ] && [ "$MODE" != "version" ] && [ "$MODE" != "publish" ]; then
              echo "FAIL: unexpected mode value '$MODE' (expected none, version, or publish)"
              exit 1
            fi
            echo "PASS: mode='$MODE' with cwd input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist/select-mode.js may not be built in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
