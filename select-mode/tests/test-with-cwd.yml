name: Test with cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working directory with changesets config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-cwd/.changeset"
          cat > "$GITHUB_WORKSPACE/test-cwd/.changeset/config.json" <<'EOF'
          {
            "changelog": false,
            "commit": false,
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          cat > "$GITHUB_WORKSPACE/test-cwd/package.json" <<'EOF'
          {
            "name": "test-pkg",
            "version": "1.0.0",
            "private": true
          }
          EOF
      - id: action
        uses: .
        with:
          cwd: ${{ github.workspace }}/test-cwd
        continue-on-error: true
      - name: Assert mode output is valid when cwd is provided
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$MODE" != "version" ] && [ "$MODE" != "publish" ] && [ "$MODE" != "none" ]; then
              echo "FAIL: expected mode to be 'version', 'publish', or 'none', got: '$MODE'"
              exit 1
            fi
            echo "PASS: mode='$MODE' with cwd input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist may not be built in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
