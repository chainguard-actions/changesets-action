name: Test version mode - changeset present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a changeset file to trigger version mode
        run: |
          mkdir -p .changeset
          cat > .changeset/test-changeset.md << 'EOF'
          ---
          "my-package": patch
          ---

          Test changeset for CI
          EOF

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert mode is version or action ran gracefully
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MODE" ]; then
              echo "FAIL: action succeeded but mode output is empty"
              exit 1
            fi
            if [ "$MODE" != "version" ]; then
              echo "FAIL: expected mode='version' but got '$MODE'"
              exit 1
            fi
            echo "PASS: mode='$MODE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing dist)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
