name: Test mode=version (changesets present)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a changeset file to simulate pending version bump
        run: |
          mkdir -p .changeset
          # Create a minimal changeset config if not present
          if [ ! -f .changeset/config.json ]; then
            cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          fi
          # Create a changeset markdown file
          cat > .changeset/test-changeset.md <<'EOF'
          ---
          "my-package": patch
          ---

          Test changeset for CI
          EOF

      - id: select-mode
        uses: .
        continue-on-error: true

      - name: Assert mode output is version or graceful failure
        env:
          MODE: ${{ steps.select-mode.outputs.mode }}
          OUTCOME: ${{ steps.select-mode.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MODE" ]; then
              echo "FAIL: action succeeded but mode output is empty"
              exit 1
            fi
            if [ "$MODE" != "version" ] && [ "$MODE" != "none" ] && [ "$MODE" != "publish" ]; then
              echo "FAIL: unexpected mode value '$MODE' (expected version, none, or publish)"
              exit 1
            fi
            echo "PASS: mode='$MODE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist/select-mode.js may not be built in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
