name: Test output consistency - artifact id only set when mode is publish
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert output consistency between mode and publish-plan-artifact-id
        env:
          MODE: ${{ steps.action.outputs.mode }}
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT_ID: ${{ steps.action.outputs.publish-plan-artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "mode: $MODE"
          echo "publish-plan-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            # Validate mode is one of the expected values
            case "$MODE" in
              version|publish|none)
                echo "mode is valid: '$MODE'"
                ;;
              *)
                echo "FAIL: mode has unexpected value: '$MODE'"
                exit 1
                ;;
            esac
            # Validate artifact-id is only set when mode is 'publish'
            if [ "$MODE" = "publish" ]; then
              if [ -z "$ARTIFACT_ID" ]; then
                echo "FAIL: publish-plan-artifact-id should be set when mode is 'publish'"
                exit 1
              fi
              echo "PASS: publish-plan-artifact-id is set ('$ARTIFACT_ID') when mode is 'publish'"
            else
              if [ -n "$ARTIFACT_ID" ]; then
                echo "FAIL: publish-plan-artifact-id should be empty when mode is '$MODE', got: '$ARTIFACT_ID'"
                exit 1
              fi
              echo "PASS: publish-plan-artifact-id is empty when mode is '$MODE'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without full changesets setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
