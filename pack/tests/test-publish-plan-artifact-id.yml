name: Test publish-plan-artifact-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          publish-plan-artifact-id: "0"
        continue-on-error: true
      - name: Assert action ran with publish-plan-artifact-id input (or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT_ID: ${{ steps.action.outputs.pack-dir-artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pack-dir-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with publish-plan-artifact-id input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or missing artifact)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
