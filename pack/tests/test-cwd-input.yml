name: Test cwd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a minimal package.json in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cat > "$GITHUB_WORKSPACE/test-pkg/package.json" <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": false
          }
          EOF

      - id: action
        uses: .
        with:
          cwd: test-pkg
        continue-on-error: true

      - name: Assert action ran with cwd input and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT_ID: ${{ steps.action.outputs.pack-dir-artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pack-dir-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cwd input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or no publishable packages)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
