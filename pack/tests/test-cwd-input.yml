name: Test cwd input - pack in a subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subdirectory for cwd test
        run: mkdir -p myproject

      - id: action
        uses: .
        with:
          cwd: myproject
        continue-on-error: true

      - name: Assert action ran with cwd input (output set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT_ID: ${{ steps.action.outputs.pack-dir-artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pack-dir-artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with artifact id '$ARTIFACT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without publishable packages or with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
