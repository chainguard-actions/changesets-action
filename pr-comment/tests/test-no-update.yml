name: Test disabled comment updating (empty update-id)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          body: "Test comment with update disabled (empty update-id)."
          update-id: ""
      - name: Assert action ran with empty update-id (comment posted or failed gracefully on sentinel repo)
        env:
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: action succeeded but comment-id output is empty"
              exit 1
            fi
            echo "PASS: comment created with id '$COMMENT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
