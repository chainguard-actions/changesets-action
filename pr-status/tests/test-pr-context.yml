name: Test with PR context env vars - changesets PR status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature/add-changeset
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body length: ${#COMMENT_BODY}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_BODY" ]; then
              echo "FAIL: action succeeded but comment-body output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with non-empty comment-body"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (PR context not fully available under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
