name: Test PR event context - changesets PR status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature/add-changeset
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body length: ${#COMMENT_BODY}"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, comment-body should be a non-empty string
            if [ -z "$COMMENT_BODY" ]; then
              echo "FAIL: action succeeded but comment-body output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with non-empty comment-body"
          elif [ "$OUTCOME" = "failure" ]; then
            # Expected: the action cannot resolve the sentinel repo or the
            # non-PR event context prevents it from fetching the PR head ref
            echo "PASS: action failed gracefully (sentinel repo / non-PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
