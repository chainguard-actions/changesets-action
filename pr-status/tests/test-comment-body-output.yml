name: Test comment-body output - changesets PR status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert comment-body output is valid when action succeeds
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body: $COMMENT_BODY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_BODY" ]; then
              echo "FAIL: action succeeded but comment-body output is empty"
              exit 1
            fi
            echo "PASS: comment-body output is non-empty: ${#COMMENT_BODY} chars"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
