name: Test cwd, version, publish, and prDraft inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: "."
          version: "changeset version"
          publish: "npm run release"
          prDraft: "create"
      - name: Assert action ran
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "publishedPackages: ${{ steps.action.outputs.publishedPackages }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "Action completed with cwd/version/publish/prDraft inputs"
          echo "PASS"
