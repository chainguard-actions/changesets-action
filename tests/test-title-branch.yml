name: Test title and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          title: "Version Packages (custom title)"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
        continue-on-error: true
      - name: Assert action ran with title and branch inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome is empty"
            exit 1
          fi
          echo "PASS: action step executed with outcome=$OUTCOME"
