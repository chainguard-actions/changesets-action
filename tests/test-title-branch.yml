name: Test title and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          title: "Version Packages (custom title)"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with title and branch inputs"
          echo "PASS"
