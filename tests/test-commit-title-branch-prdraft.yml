name: Test commit, title, branch, and prDraft inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          commit: "chore: version packages"
          title: "Version Packages (automated)"
          branch: "main"
          prDraft: "create"
          createGithubReleases: "false"
          setupGitUser: "true"
        continue-on-error: true
      - name: Assert action ran with commit/title/branch/prDraft inputs
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "pullRequestNumber: ${{ steps.action.outputs.pullRequestNumber }}"
          echo "Action completed (may fail due to no changesets config, but inputs were accepted)"
          echo "PASS"
