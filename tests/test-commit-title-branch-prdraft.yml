name: Test commit, title, branch, and prDraft inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          commit: "chore: version packages"
          title: "Version Packages (automated)"
          branch: "main"
          prDraft: "create"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
      - name: Assert action ran with commit/title/branch/prDraft inputs
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "pullRequestNumber: $PR_NUMBER"
          echo "PASS: action accepted commit/title/branch/prDraft inputs"
