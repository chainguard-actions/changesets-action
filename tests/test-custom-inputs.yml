name: Test custom commit-message and pr-title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up package.json and changeset config with a changeset
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "my-pkg", "version": "0.1.0"}' > package.json
          fi
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          # Add a changeset so the action has something to process
          cat > .changeset/custom-test-changeset.md <<'EOF'
          ---
          "my-pkg": minor
          ---

          A minor feature addition for testing
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          commit-message: "chore: version packages [skip ci]"
          pr-title: "chore: version packages"
          pr-draft: "create"

      - name: Assert action accepted custom inputs and ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PR_NUMBER: ${{ steps.action.outputs.pr-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          echo "pr-number: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HAS_CHANGESETS" != "true" ] && [ "$HAS_CHANGESETS" != "false" ]; then
              echo "FAIL: expected has-changesets to be 'true' or 'false', got: '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: action accepted custom inputs and succeeded with has-changesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for PR operations)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
