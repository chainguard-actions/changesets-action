name: Test custom commit-message and pr-title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"

      - name: Assert action succeeded with custom inputs
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "has-changesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          if [ "$HAS_CHANGESETS" != "false" ]; then
            echo "FAIL: expected has-changesets to be 'false', got '$HAS_CHANGESETS'"
            exit 1
          fi
          if [ "$PUBLISHED" != "false" ]; then
            echo "FAIL: expected published to be 'false', got '$PUBLISHED'"
            exit 1
          fi
          echo "PASS: action accepted custom inputs and ran successfully"
