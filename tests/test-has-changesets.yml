name: Test with changesets present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up a Node.js project with a changeset file
        run: |
          # Create a minimal package.json
          cat > package.json <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Create .changeset directory with config and a changeset file
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

          # Create a changeset file describing a patch change
          cat > .changeset/my-first-change.md <<'EOF'
          ---
          "test-package": patch
          ---

          Fix a bug in test-package
          EOF

          git add package.json .changeset/
          git commit -m "chore: add changeset"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert action detected changesets or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PR_NUMBER: ${{ steps.action.outputs.pr-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "pr-number: $PR_NUMBER"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify has-changesets is true since we added a changeset file
            if [ "$HAS_CHANGESETS" != "true" ]; then
              echo "FAIL: expected has-changesets to be 'true' (we added a changeset file), got: '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: action succeeded and detected changesets (has-changesets=true)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
