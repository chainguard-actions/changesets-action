name: Test - Invalid pr-draft input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Passing an invalid pr-draft value should cause the action to call
      # core.setFailed with "Invalid pr-draft: bad-value"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-draft: bad-value

      - name: Assert action failed with invalid pr-draft
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid pr-draft, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid pr-draft value"
