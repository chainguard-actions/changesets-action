name: Test title, branch, and cwd inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          title: "Version Packages (test)"
          branch: "main"
          cwd: "."
          setupGitUser: "true"
          createGithubReleases: "false"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran
        run: |
          echo "Action completed (may have errored in test env, which is expected)"
          echo "PASS: inputs title, branch, and cwd were accepted"
