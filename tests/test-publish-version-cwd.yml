name: Test publish, version, and cwd inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          publish: "echo publish-step"
          version: "echo version-step"
          cwd: "."
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert published output exists
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "published: $PUBLISHED"
          if [ -z "$PUBLISHED" ]; then
            echo "FAIL: published output was empty"
            exit 1
          fi
          echo "PASS: published output is present"
      - name: Assert publishedPackages output exists
        env:
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.publishedPackages }}
        run: |
          echo "publishedPackages: $PUBLISHED_PACKAGES"
          echo "PASS: publishedPackages output checked"
      - name: Assert hasChangesets output exists
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          if [ -z "$HAS_CHANGESETS" ]; then
            echo "FAIL: hasChangesets output was empty"
            exit 1
          fi
          echo "PASS: hasChangesets output is present"
