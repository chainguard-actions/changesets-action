name: Test publish, version, and cwd inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          publish: "echo publish"
          version: "echo version"
          cwd: "."
          createGithubReleases: "false"
          setupGitUser: "true"
        continue-on-error: true
      - name: Assert action ran with publish/version/cwd inputs
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "publishedPackages: ${{ steps.action.outputs.publishedPackages }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "Action completed (may fail due to no changesets config, but inputs were accepted)"
          echo "PASS"
