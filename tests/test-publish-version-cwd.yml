name: Test publish, version, and cwd inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish: "npm run release"
          version: "npm run version"
          cwd: "."
          setupGitUser: "true"
          createGithubReleases: "false"
      - name: Assert action ran with publish/version/cwd inputs
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "Action completed with publish, version, and cwd inputs"
          echo "PASS"
