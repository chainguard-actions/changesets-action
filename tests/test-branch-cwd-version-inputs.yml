name: Test branch, cwd, and version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a working directory with a minimal package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cd "$GITHUB_WORKSPACE/test-pkg"
          cat > package.json <<'EOF'
          {
            "name": "test-pkg",
            "version": "1.0.0",
            "private": true
          }
          EOF
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: ./test-pkg
          branch: act-harness
          version: "node -e \"console.log('version command called')\""
          setupGitUser: "true"

      - name: Assert action ran with branch/cwd/version inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
