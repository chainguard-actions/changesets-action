name: Test basic usage - no changesets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure .changeset directory exists with config but no changesets
        run: |
          mkdir -p .changeset
          # Create a minimal changeset config if it doesn't exist
          if [ ! -f .changeset/config.json ]; then
            cat > .changeset/config.json << 'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "true"

      - name: Assert action ran and hasChangesets output is set
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            # No changesets present, so hasChangesets should be false
            if [ "$HAS_CHANGESETS" != "false" ]; then
              echo "FAIL: expected hasChangesets=false but got '$HAS_CHANGESETS'"
              exit 1
            fi
            if [ "$PUBLISHED" != "false" ]; then
              echo "FAIL: expected published=false but got '$PUBLISHED'"
              exit 1
            fi
            echo "PASS: hasChangesets=$HAS_CHANGESETS, published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
