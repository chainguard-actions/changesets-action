name: Test basic usage - no changesets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no .changeset directory exists
        run: |
          rm -rf .changeset
          echo "Removed .changeset directory if it existed"

      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "true"

      - name: Assert action ran and hasChangesets is false or action failed gracefully
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HAS_CHANGESETS" != "false" ]; then
              echo "FAIL: expected hasChangesets to be 'false' but got '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: hasChangesets is false as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
