name: Test version, cwd, and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "changeset version"
          cwd: "."
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        env:
          GITHUB_TOKEN: "dummy-token"
      - name: Assert action ran
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "PASS: action ran with version, cwd, and branch inputs"
