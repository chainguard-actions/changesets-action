name: Test version, cwd, and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          version: "changeset version"
          cwd: "."
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
        continue-on-error: true
      - name: Assert action outputs are accessible
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.publishedPackages }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "publishedPackages: $PUBLISHED_PACKAGES"
          echo "pullRequestNumber: $PR_NUMBER"
          echo "PASS: action completed with version, cwd, and branch inputs"
