name: Test publish mode with publish-script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up package.json and changeset config (no pending changesets)
        run: |
          # Create a minimal package.json
          if [ ! -f package.json ]; then
            echo '{"name": "test-pkg", "version": "1.0.0"}' > package.json
          fi
          # Ensure .changeset directory exists with config but no changeset files
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          # Create a fake publish script that echoes success
          cat > /tmp/fake-publish.sh <<'SCRIPT'
          #!/bin/sh
          echo "Fake publish: no packages to publish"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-publish.sh

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish-script: "sh /tmp/fake-publish.sh"
          create-github-releases: "false"
          push-git-tags: "false"

      - name: Assert action ran with publish-script or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.published-packages }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "published-packages: $PUBLISHED_PACKAGES"
          echo "has-changesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify outputs are set
            if [ "$PUBLISHED" != "false" ] && [ "$PUBLISHED" != "true" ]; then
              echo "FAIL: expected published to be 'true' or 'false', got: '$PUBLISHED'"
              exit 1
            fi
            echo "PASS: action succeeded in publish mode with published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
