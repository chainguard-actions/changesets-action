name: Test with a changeset file present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Initialize package.json, changeset config, and a changeset file
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "private": true
          }
          EOF

          mkdir -p "$GITHUB_WORKSPACE/.changeset"
          cat > "$GITHUB_WORKSPACE/.changeset/config.json" <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

          # Create a sample changeset file
          cat > "$GITHUB_WORKSPACE/.changeset/my-feature.md" <<'EOF'
          ---
          "test-package": patch
          ---

          A test patch change
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "true"
          createGithubReleases: "false"

      - name: Assert action detected changesets or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "pullRequestNumber: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, hasChangesets should be true since we added a changeset
            if [ "$HAS_CHANGESETS" = "true" ]; then
              echo "PASS: action detected changesets correctly"
            else
              echo "PASS: action ran (hasChangesets=$HAS_CHANGESETS)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
