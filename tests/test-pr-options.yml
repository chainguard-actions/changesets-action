name: Test PR and commit options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: "main"
          prDraft: "create"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
      - name: Assert action ran with PR and commit options
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "pullRequestNumber: ${{ steps.action.outputs.pullRequestNumber }}"
          echo "Action completed with commit, title, branch, and prDraft inputs"
          echo "PASS"
