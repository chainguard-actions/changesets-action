name: Test publish command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish: "echo publish"
          cwd: "."
          setupGitUser: "false"
          createGithubReleases: "false"
          commitMode: "github-api"
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
      - name: Assert outputs accessible
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.publishedPackages }}
        run: |
          echo "published: $PUBLISHED"
          echo "publishedPackages: $PUBLISHED_PACKAGES"
          echo "PASS: action ran with publish/cwd inputs"
