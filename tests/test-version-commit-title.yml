name: Test version, commit, and title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "changeset version"
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: "false"
          setupGitUser: "true"
        continue-on-error: true
      - name: Assert action ran with version commit and title inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "PASS: action executed with version, commit, and title inputs"
