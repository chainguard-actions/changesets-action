name: Test with publish script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish-script: "echo 'publishing'"
          create-github-releases: "true"
          push-git-tags: "true"

      - name: Assert action ran with publish script or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.published-packages }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "published-packages: $PUBLISHED_PACKAGES"
          echo "has-changesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            # On success, published should be "true" or "false"
            if [ "$PUBLISHED" != "true" ] && [ "$PUBLISHED" != "false" ]; then
              echo "FAIL: expected published to be 'true' or 'false', got: '$PUBLISHED'"
              exit 1
            fi
            # If published is true, published-packages should be a JSON array
            if [ "$PUBLISHED" = "true" ]; then
              if [ -z "$PUBLISHED_PACKAGES" ]; then
                echo "FAIL: published is true but published-packages is empty"
                exit 1
              fi
              echo "published-packages value: $PUBLISHED_PACKAGES"
            fi
            echo "PASS: action succeeded with publish script"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
