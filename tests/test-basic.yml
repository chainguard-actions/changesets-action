name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
          branch: "main"
        env:
          GITHUB_TOKEN: "fake-token-for-testing"
      - name: Assert action ran
        run: |
          echo "Action completed (with or without error due to missing real token)"
          echo "PASS"
