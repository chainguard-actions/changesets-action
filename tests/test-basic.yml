name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
      - name: Assert action ran (outputs present or action failed gracefully)
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "PASS: action completed (outputs may be empty in test environment)"
