name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          commit: "Version Packages"
          title: "Version Packages"
          branch: main
          cwd: .
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert outputs exist
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          # The action should produce these outputs (even if empty/false)
          # We just verify the step ran and produced recognizable output values
          if [ "$PUBLISHED" = "true" ] || [ "$PUBLISHED" = "false" ] || [ -z "$PUBLISHED" ]; then
            echo "PASS: published output is valid"
          else
            echo "FAIL: unexpected published value: $PUBLISHED"
            exit 1
          fi
          echo "PASS"
