name: Test publish and version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          publish: "echo publish-command"
          version: "echo version-command"
          createGithubReleases: "false"
        continue-on-error: true
      - name: Assert action ran with publish and version inputs
        run: |
          echo "Action completed with publish and version inputs"
          echo "PASS"
