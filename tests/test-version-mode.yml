name: Test version mode with custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        run: node --version
      - name: Create minimal package.json
        run: |
          mkdir -p /tmp/test-cwd
          cat > /tmp/test-cwd/package.json <<'EOF'
          {
            "name": "test-pkg",
            "version": "1.0.0",
            "private": true
          }
          EOF
          mkdir -p /tmp/test-cwd/.changeset
          cat > /tmp/test-cwd/.changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cwd: /tmp/test-cwd
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: main
          version: "echo version-command"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
      - name: Assert outputs exist
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          # The action may fail due to no real GitHub token, but outputs should be set or action continues-on-error
          echo "PASS: action ran with custom inputs"
