name: Test publish-script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish-script: echo "publish"
      - name: Assert action ran with publish-script input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.published-packages }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "published-packages: $PUBLISHED_PACKAGES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with publish-script input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
