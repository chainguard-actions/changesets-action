name: Test publish-script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          publish-script: echo "publish"
      - name: Assert action ran with publish-script input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "has-changesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HAS_CHANGESETS" ] && [ -z "$PUBLISHED" ]; then
              echo "FAIL: action succeeded but both has-changesets and published outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with published=$PUBLISHED has-changesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
