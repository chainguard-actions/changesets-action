name: Test with changesets present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up changeset config and a changeset file
        run: |
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          cat > .changeset/test-changeset.md <<'EOF'
          ---
          "my-package": patch
          ---

          A test changeset for CI
          EOF

      - name: Set up a minimal package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-package",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Commit changeset files so git is clean
        run: |
          git add .changeset package.json
          git commit -m "add test changeset" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert hasChangesets output or graceful failure
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HAS_CHANGESETS" != "true" ]; then
              echo "FAIL: expected hasChangesets=true but got '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: hasChangesets=true as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
