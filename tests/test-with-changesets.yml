name: Test with changesets present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal package.json and changeset config
        run: |
          # Create a minimal package.json if not present
          if [ ! -f package.json ]; then
            echo '{"name": "test-repo", "version": "1.0.0", "private": true}' > package.json
          fi
          # Create .changeset directory with config
          mkdir -p .changeset
          cat > .changeset/config.json << 'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          # Create a sample changeset file
          cat > .changeset/test-changeset.md << 'EOF'
          ---
          "test-repo": patch
          ---

          A test patch change
          EOF

      - name: Set up git user and commit changeset
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .changeset/
          git commit -m "Add test changeset" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          setupGitUser: "true"
          commit: "Version Packages (test)"
          title: "Version Packages (test)"

      - name: Assert action ran with changesets detected or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "pullRequestNumber: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — hasChangesets should be true since we added a changeset
            if [ "$HAS_CHANGESETS" != "true" ]; then
              echo "FAIL: expected hasChangesets=true but got: '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: action succeeded with hasChangesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo — PR creation requires real repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
