name: Test with changesets present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up package.json, changeset config, and a changeset file
        run: |
          # Create a minimal package.json
          if [ ! -f package.json ]; then
            echo '{"name": "test-pkg", "version": "1.0.0"}' > package.json
          fi
          # Ensure .changeset directory exists with config
          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          # Create a changeset file
          cat > .changeset/test-changeset.md <<'EOF'
          ---
          "test-pkg": patch
          ---

          A test patch change
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          commit-message: "Version Packages (test)"
          pr-title: "Version Packages (test)"

      - name: Assert action ran and detected changesets or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PR_NUMBER: ${{ steps.action.outputs.pr-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "pr-number: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify has-changesets is true since we added a changeset
            if [ "$HAS_CHANGESETS" != "true" ]; then
              echo "FAIL: expected has-changesets to be 'true' (we added a changeset), got: '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: action succeeded with has-changesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for PR creation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
