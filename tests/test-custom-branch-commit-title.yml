name: Test custom branch, commit, and title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          branch: main
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: "true"
      - name: Assert action ran with custom branch/commit/title inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
