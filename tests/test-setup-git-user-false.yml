name: Test setupGitUser false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up custom git user
        run: |
          git config user.email "custom@example.com"
          git config user.name "Custom User"

      - name: Ensure .changeset directory exists with config
        run: |
          mkdir -p .changeset
          if [ ! -f .changeset/config.json ]; then
            cat > .changeset/config.json << 'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          setupGitUser: "false"

      - name: Assert git user was not overridden by action
        run: |
          GIT_EMAIL="$(git config user.email)"
          GIT_NAME="$(git config user.name)"
          echo "git user.email: $GIT_EMAIL"
          echo "git user.name: $GIT_NAME"
          if [ "$GIT_EMAIL" != "custom@example.com" ]; then
            echo "FAIL: expected git user.email to remain 'custom@example.com' but got '$GIT_EMAIL'"
            exit 1
          fi
          if [ "$GIT_NAME" != "Custom User" ]; then
            echo "FAIL: expected git user.name to remain 'Custom User' but got '$GIT_NAME'"
            exit 1
          fi
          echo "PASS: git user was not overridden"

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
