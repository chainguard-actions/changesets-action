name: Test changesets action - custom PR title and commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure .changeset directory exists with config
        run: |
          mkdir -p .changeset
          if [ ! -f .changeset/config.json ]; then
            cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          commit-message: "chore: version packages [ci skip]"
          pr-title: "chore: version packages"

      - name: Assert action ran with custom inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PR_NUMBER: ${{ steps.action.outputs.pr-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          echo "pr-number: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HAS_CHANGESETS" != "true" ] && [ "$HAS_CHANGESETS" != "false" ]; then
              echo "FAIL: expected has-changesets to be 'true' or 'false', got: '$HAS_CHANGESETS'"
              exit 1
            fi
            echo "PASS: action succeeded with has-changesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo - API calls fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
