name: Test invalid commitMode fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a minimal changeset workspace in a git repo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-workspace/.changeset"
          cd "$GITHUB_WORKSPACE/test-workspace"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > .changeset/config.json << 'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@1.6.2/schema.json",
            "changelog": "@changesets/changelog-git",
            "commit": false,
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          cat > package.json << 'EOF'
          {
            "name": "test-workspace",
            "version": "1.0.0",
            "private": true
          }
          EOF
          git add -A
          git commit -m "init"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          cwd: ${{ github.workspace }}/test-workspace
          commitMode: invalid-mode
        continue-on-error: true

      - name: Assert action failed due to invalid commitMode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid commitMode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid commitMode"
