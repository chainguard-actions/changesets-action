name: Test version PR inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          version: "changeset version"
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
      - name: Assert action ran with version PR inputs
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "published: $PUBLISHED"
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "pullRequestNumber: $PR_NUMBER"
          echo "PASS: action completed with version/commit/title/branch inputs"
