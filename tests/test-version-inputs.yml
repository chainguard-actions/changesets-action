name: Test version, commit, and title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "changeset version"
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: "true"
          createGithubReleases: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "PASS: action ran with version, commit, and title inputs"
