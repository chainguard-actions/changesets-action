name: Test cwd and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          cwd: "."
          branch: "main"
          createGithubReleases: "false"
          setupGitUser: "true"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert action ran with cwd and branch inputs
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "PASS: action ran with cwd and branch inputs"
