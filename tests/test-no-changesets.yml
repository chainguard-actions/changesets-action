name: Test no changesets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up minimal package.json and changeset config (no changesets)
        run: |
          # Create a minimal package.json if not present
          if [ ! -f package.json ]; then
            echo '{"name": "test-repo", "version": "1.0.0", "private": true}' > package.json
          fi
          # Ensure .changeset directory exists with config but no changeset files
          mkdir -p .changeset
          if [ ! -f .changeset/config.json ]; then
            cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "act-harness",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify outputs are set
            if [ "$HAS_CHANGESETS" != "false" ] && [ "$HAS_CHANGESETS" != "true" ]; then
              echo "FAIL: expected has-changesets to be 'true' or 'false', got: '$HAS_CHANGESETS'"
              exit 1
            fi
            if [ "$PUBLISHED" != "false" ] && [ "$PUBLISHED" != "true" ]; then
              echo "FAIL: expected published to be 'true' or 'false', got: '$PUBLISHED'"
              exit 1
            fi
            echo "PASS: action succeeded with has-changesets=$HAS_CHANGESETS published=$PUBLISHED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
