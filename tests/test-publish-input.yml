name: Test publish input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          publish: "echo publish-step"
          version: "echo version-step"
          setupGitUser: "true"
          createGithubReleases: "false"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          echo "hasChangesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
