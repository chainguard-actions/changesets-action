name: Test pr-base-branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-base-branch: main
      - name: Assert action ran with pr-base-branch input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CHANGESETS: ${{ steps.action.outputs.has-changesets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-changesets: $HAS_CHANGESETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HAS_CHANGESETS" ]; then
              echo "FAIL: action succeeded but has-changesets output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with has-changesets=$HAS_CHANGESETS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
