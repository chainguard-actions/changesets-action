name: Test all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          publish: "echo publish-step"
          version: "echo version-step"
          commit: "chore: version packages"
          title: "Version Packages (automated)"
          branch: "main"
          cwd: "."
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
      - name: Assert hasChangesets output exists
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "PASS: output checked"
      - name: Assert published output exists
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "published: $PUBLISHED"
          echo "PASS: output checked"
      - name: Assert pullRequestNumber output exists
        env:
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "pullRequestNumber: $PR_NUMBER"
          echo "PASS: output checked"
