name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          publish: "echo publish-step"
          version: "echo version-step"
          cwd: "."
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert step ran
        env:
          HAS_CHANGESETS: ${{ steps.action.outputs.hasChangesets }}
          PUBLISHED: ${{ steps.action.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.publishedPackages }}
          PR_NUMBER: ${{ steps.action.outputs.pullRequestNumber }}
        run: |
          echo "hasChangesets: $HAS_CHANGESETS"
          echo "published: $PUBLISHED"
          echo "publishedPackages: $PUBLISHED_PACKAGES"
          echo "pullRequestNumber: $PR_NUMBER"
          echo "PASS: action step executed with all inputs"
