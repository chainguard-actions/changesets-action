name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          publish: "echo publish-command"
          version: "echo version-command"
          cwd: "."
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert outputs present
        run: |
          echo "published: ${{ steps.action.outputs.published }}"
          echo "hasChangesets: ${{ steps.action.outputs.hasChangesets }}"
          echo "pullRequestNumber: ${{ steps.action.outputs.pullRequestNumber }}"
          echo "publishedPackages: ${{ steps.action.outputs.publishedPackages }}"
          echo "Action completed (may fail due to no changesets or permissions in test env)"
          echo "PASS"
