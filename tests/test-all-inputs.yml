name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          publish: "echo publish-command"
          version: "echo version-command"
          cwd: "."
          commit: "chore: version packages"
          title: "chore: version packages"
          branch: "main"
          setupGitUser: "true"
          createGithubReleases: "false"
          commitMode: "git-cli"
        continue-on-error: true
      - name: Assert step ran
        run: |
          echo "Action step completed (may fail due to missing real GITHUB_TOKEN)"
          echo "PASS: all inputs were accepted by the action"
